<title>Inédita Questões</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: app de estudo em vidro, estilo Apple. Desktop: menu lateral de vidro flutuante + conteúdo com títulos grandes. Estreito: conteúdo em coluna e barra de abas de vidro presa embaixo. Cor só no vermelho de ação e no mascote. */
:root {
  --bg: #f2f2f7;
  --bg-blob-1: rgba(255, 149, 128, 0.22);
  --bg-blob-2: rgba(150, 170, 255, 0.20);
  --glass: rgba(255, 255, 255, 0.66);
  --glass-strong: rgba(255, 255, 255, 0.86);
  --glass-line: rgba(255, 255, 255, 0.75);
  --hair: rgba(60, 60, 67, 0.12);
  --fill: rgba(118, 118, 128, 0.12);
  --fill-2: rgba(118, 118, 128, 0.2);
  --ink: #1c1c1e;
  --ink-2: #3a3a3c;
  --muted: #8e8e93;
  --accent: #ff3b30;
  --accent-press: #d70015;
  --accent-soft: rgba(255, 59, 48, 0.1);
  --on-accent: #ffffff;
  --ok: #248a3d; --ok-soft: rgba(52, 199, 89, 0.14);
  --bad: #d70015; --bad-soft: rgba(255, 59, 48, 0.12);
  --warn: #a05a00; --warn-soft: rgba(255, 149, 0, 0.14);
  --shadow: 0 1px 1px rgba(0,0,0,.03), 0 8px 28px rgba(30, 30, 60, 0.08);
  --shadow-lg: 0 20px 60px rgba(30, 30, 60, 0.16);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  --f-text: "Source Serif 4", "New York", Georgia, serif;
  --f-read: var(--f-ui);
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --bg-blob-1: rgba(255, 90, 70, 0.16); --bg-blob-2: rgba(90, 110, 255, 0.16);
    --glass: rgba(28, 28, 32, 0.62); --glass-strong: rgba(38, 38, 44, 0.86); --glass-line: rgba(255, 255, 255, 0.09);
    --hair: rgba(255, 255, 255, 0.1); --fill: rgba(118, 118, 128, 0.24); --fill-2: rgba(118, 118, 128, 0.34);
    --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #98989f;
    --accent: #ff453a; --accent-press: #ff6961; --accent-soft: rgba(255, 69, 58, 0.16);
    --ok: #30d158; --ok-soft: rgba(48, 209, 88, 0.16); --bad: #ff6961; --bad-soft: rgba(255, 69, 58, 0.16); --warn: #ffb340; --warn-soft: rgba(255, 159, 10, 0.16);
    --shadow: 0 1px 1px rgba(0,0,0,.2), 0 8px 28px rgba(0, 0, 0, 0.4); --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --bg-blob-1: rgba(255, 90, 70, 0.16); --bg-blob-2: rgba(90, 110, 255, 0.16);
  --glass: rgba(28, 28, 32, 0.62); --glass-strong: rgba(38, 38, 44, 0.86); --glass-line: rgba(255, 255, 255, 0.09);
  --hair: rgba(255, 255, 255, 0.1); --fill: rgba(118, 118, 128, 0.24); --fill-2: rgba(118, 118, 128, 0.34);
  --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #98989f;
  --accent: #ff453a; --accent-press: #ff6961; --accent-soft: rgba(255, 69, 58, 0.16);
  --ok: #30d158; --ok-soft: rgba(48, 209, 88, 0.16); --bad: #ff6961; --bad-soft: rgba(255, 69, 58, 0.16); --warn: #ffb340; --warn-soft: rgba(255, 159, 10, 0.16);
  --shadow: 0 1px 1px rgba(0,0,0,.2), 0 8px 28px rgba(0, 0, 0, 0.4); --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html.app-mac .sidebar { padding-top: 46px; }
html.app-mac .l-theme { top: 14px; }
:root[data-read="serif"] { --f-read: "Source Serif 4", "New York", Georgia, serif; }
:root[data-size="lg"] .stem { font-size: 19.5px; }
:root[data-size="lg"] .alt { font-size: 17.5px; }
:root[data-size="lg"] .sol p, :root[data-size="lg"] .law { font-size: 17px; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(40% 35% at 85% 0%, var(--bg-blob-1), transparent 70%), radial-gradient(45% 40% at 0% 100%, var(--bg-blob-2), transparent 70%); }
#app { position: relative; z-index: 1; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-display); letter-spacing: -0.022em; }
p { margin: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
input[type=text], input[type=search], input[type=password], input[type=email], select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--fill); border: 0; border-radius: 12px; padding: 11px 14px; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { resize: vertical; min-height: 110px; font-size: 14px; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); }
input:disabled, select:disabled { opacity: .45; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--glass-line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35); }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: transform .15s ease, background .15s ease; }
.btn:hover { background: var(--accent-press); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: progress; }
.btn.lg { padding: 15px 26px; font-size: 16px; }
.btn.sm { padding: 8px 15px; font-size: 14px; }
.btn.block { width: 100%; }
.btn svg, .tbtn svg { width: 17px; height: 17px; flex: none; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); text-decoration: none; transition: background .15s; }
.tbtn:hover { background: var(--fill-2); }
.tbtn.danger { color: var(--bad); }
.tbtn.plain { background: transparent; color: var(--accent); padding-inline: 6px; }
.tbtn[aria-pressed=true] { color: var(--accent); background: var(--accent-soft); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }

/* Controles segmentados (estilo iOS) */
.segc { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--fill); border-radius: 12px; padding: 3px; max-width: 100%; }
.segc button { border: 0; background: transparent; border-radius: 9px; padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); white-space: nowrap; transition: background .15s, box-shadow .15s; }
.segc button[aria-pressed=true] { background: var(--ink); color: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.18); font-weight: 700; }
.segc button[aria-pressed=true]::before { content: "✓ "; font-weight: 700; }
.segc button:not([aria-pressed=true]):hover { background: var(--fill-2); }
.segc.full { display: flex; }
.segc.full button { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; border: 0; background: var(--fill); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); }

/* Shell */
.layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 14px 0 14px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
.sidebar-in { height: 100%; border-radius: 26px; padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; background: none; border: 0; cursor: pointer; text-align: left; }
.brand .appicon { width: 40px; height: 40px; }
.brand b { display: block; font-family: var(--f-display); font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
.snav { display: flex; flex-direction: column; gap: 2px; }
.snav .grp { font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 12px 6px; }
.snav button { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 9px 12px; font-size: 15px; cursor: pointer; border-radius: 12px; color: var(--ink); text-align: left; width: 100%; }
.snav button svg { width: 19px; height: 19px; flex: none; color: var(--muted); }
.snav button:hover { background: var(--fill); }
.snav button[aria-current=page] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.snav button[aria-current=page] svg { color: var(--accent); }
.snav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 6px 2px; border-top: 1px solid var(--hair); }
.me .uname { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--fill-2); color: var(--ink); font-weight: 600; display: grid; place-items: center; font-size: 14px; flex: none; border: 0; cursor: pointer; }
.content { min-width: 0; display: flex; flex-direction: column; }
.page { width: 100%; max-width: 1000px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1001px) { .page { padding-left: 44px; padding-right: max(44px, env(safe-area-inset-right, 0px)); } }
main.page { padding-block: 44px 64px; display: flex; flex-direction: column; gap: 32px; flex: 1; }
.tabbar, .sheet-wrap, .mtop { display: none; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  main.page { padding-block: 8px 130px; gap: 26px; }
  .mtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
  .mtop .brand { padding: 0; }
  .mtop .brand .appicon { width: 34px; height: 34px; }
  .tabbar { display: flex; position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0 auto; max-width: 520px; border-radius: 30px; padding: 6px; justify-content: space-between; }
  .tabbar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; border-radius: 24px; padding: 7px 2px 6px; font-size: 10.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tabbar button svg { width: 23px; height: 23px; }
  .tabbar button[aria-current=page] { color: var(--accent); background: var(--accent-soft); }
  .tabbar button.make svg { width: 26px; height: 26px; }
  .sheet-wrap:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.25); }
  .sheet { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 520px; margin: 0 auto; border-radius: 28px; padding: 10px; display: flex; flex-direction: column; gap: 2px; background: var(--glass-strong); }
  .sheet button { display: flex; align-items: center; gap: 14px; border: 0; background: transparent; padding: 13px 14px; border-radius: 16px; font-size: 16px; cursor: pointer; text-align: left; color: var(--ink); }
  .sheet button:hover { background: var(--fill); }
  .sheet button svg { width: 21px; height: 21px; color: var(--muted); }
  .sheet hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 10px; }
}

/* Cabeçalho de página */
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.phead h1 { font-size: clamp(30px, 4vw, 40px); font-weight: 700; line-height: 1.08; }
.phead p { color: var(--muted); font-size: 16px; margin-top: 6px; max-width: 60ch; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-title { font-size: 21px; font-weight: 700; }

/* Cartões e listas agrupadas */
.card { border-radius: 24px; padding: 24px; }
.group { border-radius: 20px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 18px; border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--ink); position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--hair); }
.row:hover { background: var(--fill); }
.row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ink-2); }
.row .ic svg { width: 19px; height: 19px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx span { display: block; font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.row .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* Mascote */
.mascot { display: block; width: 120px; height: 120px; flex: none; filter: drop-shadow(0 10px 14px rgba(120, 60, 20, 0.22)); }
.appicon { display: block; width: 40px; height: 40px; flex: none; filter: drop-shadow(0 4px 8px rgba(255, 90, 50, 0.3)); }
.mascot.float { animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 32px 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 420px; border-radius: 32px; padding: 36px 30px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; box-shadow: var(--shadow-lg); }
.login-card .appicon { width: 104px; height: 104px; filter: drop-shadow(0 14px 24px rgba(255, 90, 50, 0.35)); }
.login-card h1 { font-size: 34px; font-weight: 700; }
.login-card .lead { font-size: 16px; color: var(--muted); max-width: 30ch; }
.login-card .acts { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.login-feats { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.login-feats span { display: inline-flex; align-items: center; gap: 6px; }
.login-feats svg { width: 15px; height: 15px; }

/* Login: uma tela só no fundo da marca, texto e formulário lado a lado, centrados na página */
.login2 { position: relative; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: linear-gradient(155deg, #ffa765 0%, #ff7748 45%, #e8463a 100%); padding-block: 96px 56px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.login2::before { content: ""; position: absolute; width: 640px; height: 640px; border-radius: 50%; background: rgba(255,255,255,.09); top: -260px; right: -180px; }
.login2::after { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: rgba(255,255,255,.07); bottom: -200px; left: -140px; }
.l-wrap { position: relative; z-index: 1; width: min(1040px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 64px; align-items: center; }
.l-hero { color: #fff; display: flex; flex-direction: column; gap: 20px; }
.l-brand { position: absolute; z-index: 2; top: 28px; left: max(32px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; color: #fff; font-size: 18px; }
.l-brand .appicon { width: 34px; height: 34px; }
.l-theme { position: absolute !important; z-index: 2; top: 24px; right: max(28px, env(safe-area-inset-right, 0px)); background: rgba(255,255,255,.22) !important; color: #fff !important; }
.l-hero .mascot { width: 150px; height: 150px; filter: drop-shadow(0 18px 24px rgba(120, 30, 10, .35)); }
.l-hero h1 { font-size: clamp(34px, 4.4vw, 54px); font-weight: 800; line-height: 1.05; color: #fff; max-width: 13ch; }
.l-hero p { font-size: 18px; line-height: 1.5; color: rgba(255,255,255,.92); max-width: 40ch; }
.l-feats { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.l-feats li { display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 600; }
.l-feats .ic { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
.l-feats .ic svg { width: 20px; height: 20px; }
.l-form { width: 100%; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 14px; background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--glass-line); box-shadow: 0 30px 80px rgba(110, 30, 10, .35); }
.l-form .l-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.l-form .l-sub { color: var(--muted); font-size: 15px; margin-top: -8px; }
.l-form input[type=email], .l-form input[type=password], .l-form input[type=text] { padding: 14px 16px; font-size: 16px; }
.pw { position: relative; }
.pw input { padding-right: 96px !important; }
.pw button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 10px; cursor: pointer; border-radius: 8px; }
.pw button:hover { color: var(--ink); }
.l-msg { font-size: 14px; color: var(--bad); text-align: center; }
.l-msg:empty { display: none; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--hair); }
.l-form .tbtn.plain { align-self: center; }
.btn-sec { width: 100%; border: 0; border-radius: 999px; padding: 14px 20px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--fill-2); color: var(--ink); }
.btn-sec:hover { background: var(--fill); box-shadow: inset 0 0 0 1px var(--hair); }
.l-note { text-align: center; font-size: 12.5px; color: var(--muted); }
.l-who { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
@media (max-width: 900px) {
  .l-wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; justify-items: center; }
  .l-hero { align-items: center; text-align: center; }
  .l-hero .mascot { width: 104px; height: 104px; }
  .l-hero h1 { font-size: 34px; margin-inline: auto; }
  .l-hero p { margin-inline: auto; }
  .l-feats { display: none; }
  .l-form { max-width: 440px; padding: 22px; }
  .l-brand { left: max(20px, env(safe-area-inset-left, 0px)); top: 20px; }
  .l-theme { top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* Início */
.hello { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: center; border-radius: 28px; padding: 30px 32px; }
.hello h1 { font-size: clamp(28px, 3.6vw, 36px); font-weight: 700; line-height: 1.1; }
.hello p { color: var(--muted); font-size: 16px; margin-top: 6px; }
.hello .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.hello .mascot { width: 150px; height: 150px; }
@media (max-width: 560px) { .hello { grid-template-columns: minmax(0, 1fr); padding: 24px; } .hello .mascot { width: 96px; height: 96px; grid-row: 1; } }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mode { border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; text-align: left; cursor: pointer; color: var(--ink); transition: transform .15s; }

const $ = id => document.getElementById(id);

function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function seg(id, options, value, full) {
  const s = el("div", "segc" + (full ? " full" : "")); s.id = id; s.setAttribute("role", "group");
  options.forEach(([v, label]) => { const b = btn("", label); b.dataset.v = v; b.setAttribute("aria-pressed", String(v === value)); s.append(b); });
  s.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; s.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); s.dispatchEvent(new Event("change")); });
  return s;
}
const segVal = s => s.querySelector("[aria-pressed=true]")?.dataset.v ?? "";
function field(label, control, hint) { const f = el("div", "field"); const l = el(control.id ? "label" : "span", control.id ? null : "lbl", label); if (control.id) l.htmlFor = control.id; if (hint) l.append(" ", el("span", "hint", hint)); f.append(l, control); return f; }
function input(id, value, ph) { const i = el("input"); i.type = "text"; i.id = id; i.value = value || ""; if (ph) i.placeholder = ph; return i; }
function select(id, opts, value, allLabel) { const s = el("select"); s.id = id; if (allLabel) { const o = el("option", null, allLabel); o.value = ""; s.append(o); } opts.forEach(v => { const o = el("option", null, v); o.value = v; if (v === value) o.selected = true; s.append(o); }); return s; }

function ring(p) {
  const r = 36, c = 2 * Math.PI * r;
  const w = el("div", "ring");
  w.innerHTML = `<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--fill-2)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - (p || 0) / 100)}"/></svg>`;

/* ================= Armazenamento ================= */
const Store = {
  mode: "local", col: null, timers: {},
  async init() {
    if (caps.db && caps.user) {
      try {
        const id = await caps.user.id();
        if (id) {
          this.mode = "db"; this.col = caps.db.collection("data/users/" + id);
          let first = true;
          const to = setTimeout(() => { if (first) { first = false; render(); } }, 10000);
          this.col.onSnapshot(snap => {
            const cads = [], prefsDoc = snap.docs.find(d => d.id === "prefs");
            snap.docs.forEach(d => { if (d.id.startsWith("cad_")) { const v = d.data(); if (v && Array.isArray(v.questions)) cads.push({ ...v, id: d.id }); } });
            cads.sort((a, b) => b.ts - a.ts);
            state.cads = cads;
            if (prefsDoc) state.prefs = { favs: [], reports: [], sims: [], ...prefsDoc.data() };
            if (first) { first = false; clearTimeout(to); render(); } else softRefresh();
          }, () => { clearTimeout(to); this.fallback(); });
          return;
        }
      } catch {}
    }
    this.fallback();
  },
  fallback() { this.mode = "local"; state.cads = lsGet("ineditas.v2.cads", []); state.prefs = { favs: [], reports: [], sims: [], ...lsGet("ineditas.v2.prefs", {}) }; render(); },
  plain(c) { return JSON.parse(JSON.stringify({ ts: c.ts, cfg: c.cfg, titulo: c.titulo || "", questions: c.questions, answers: c.answers || {} })); },
  saveCad(c) {
    if (c.exemplo) return;
    if (!state.cads.find(x => x.id === c.id)) state.cads.unshift(c);
    if (this.mode === "db") this.col.doc(c.id).set(this.plain(c)).catch(() => toast("Não foi possível salvar o caderno."));
    else lsSet("ineditas.v2.cads", state.cads.slice(0, 60).map(x => ({ ...this.plain(x), id: x.id })));
  },
  saveAnswers(c) {
    if (c.exemplo) return;
    clearTimeout(this.timers[c.id]);
    this.timers[c.id] = setTimeout(() => {
      if (this.mode === "db") this.col.doc(c.id).update({ answers: { ...c.answers } }).catch(() => toast("Não foi possível salvar suas respostas."));
      else this.saveCad(c);
    }, 700);
  },
  delCad(id) {
    state.cads = state.cads.filter(c => c.id !== id);
    if (this.mode === "db") this.col.doc(id).delete().catch(() => toast("Não foi possível excluir."));
    else lsSet("ineditas.v2.cads", state.cads.map(x => ({ ...this.plain(x), id: x.id })));
  },
  savePrefs() {
    clearTimeout(this.timers.prefs);
    this.timers.prefs = setTimeout(() => {
      const p = { favs: state.prefs.favs.slice(-500), reports: state.prefs.reports.slice(-200), sims: state.prefs.sims.slice(0, 40) };
      if (this.mode === "db") this.col.doc("prefs").set(p).catch(() => toast("Não foi possível salvar suas preferências."));
      else lsSet("ineditas.v2.prefs", p);
    }, 500);
  }
};

/* ================= Prompt e geração ================= */
function buildPrompt(c, n, base, edital, avoid) {
  const nAlt = c.tipo === "ME4" ? 4 : 5;
  const fmt = c.tipo === "CE"
    ? 'Formato Certo/Errado: "enunciado" é a assertiva completa a ser julgada; "gabarito" é "CERTO" ou "ERRADO"; não inclua "alternativas". Entre 40% e 60% CERTO, nunca mais de 3 gabaritos iguais seguidos.'
    : `Múltipla escolha com ${nAlt} alternativas: "alternativas" é um array de ${nAlt} strings SEM a letra; "gabarito" é a letra (${nAlt === 4 ? "A–D" : "A–E"}). Distribua os gabaritos entre as letras, sem a mesma letra mais de 2 vezes seguidas. Distratores plausíveis e uma única correta.`;
  const dif = c.dific === "mista" ? "Dificuldade mista: cerca de 30% fácil, 40% médio e 30% difícil."
    : `Todas com dificuldade "${c.dific}" (fácil = conceito direto; médio = comparar dispositivos ou aplicar a um caso; difícil = pegadinhas de banca, exceções, prazos e competências).`;
  const est = c.estilo === "literal" ? "Cerca de 70% literalidade de lei e 30% casos práticos." : c.estilo === "pratico" ? "Cerca de 70% casos práticos com nomes fictícios e 30% literalidade." : "Cerca de 50% literalidade de lei e 50% casos práticos com nomes fictícios.";
  const local = c.esfera === "Regional" ? `Concurso regional: ${c.regiao || "órgão regional"}${c.uf ? " (" + c.uf + ")" : ""}.` : c.esfera === "Federal" ? "Concurso federal." : c.esfera === "Estadual" ? `Concurso estadual, estado: ${c.uf}.` : c.esfera === "Distrital" ? `Concurso distrital${c.municipio ? " (" + c.municipio + ")" : ""}, Distrito Federal.` : `Concurso municipal: ${c.municipio || "município não informado"} – ${c.uf}.`;
  return [
    "Você é um elaborador sênior de questões INÉDITAS para concursos públicos brasileiros.",
    `Gere exatamente ${n} questão(ões) para este certame:`,
    `- ${local}`,
    `- Órgão: ${c.orgao || "não informado"}. Cargo: ${c.cargo || "não informado"}. Escolaridade: ${c.nivel}.`,
    `- Imite o estilo de redação e de cobrança da banca ${c.banca}.`,
    `- Disciplinas (distribua entre elas): ${c.disc.length ? c.disc.join("; ") : "conhecimentos gerais do cargo"}.`,
    c.assunto ? `- Foco do assunto: ${c.assunto}.` : "",
    "", "Regras invioláveis:",
    "1. Questões originais, nunca copiadas de provas existentes. Contextualize no órgão e na localidade quando fizer sentido (nomes fictícios: João, Maria, Ana, Pedro).",
    `2. Em disciplinas jurídicas: ${est} Na literalidade, gere o erro por troca de prazo, de competência, de modalidade ('poderá'/'deverá'), inversão de condição ou omissão de exceção.`,
    "3. A mesma lei do enunciado é a que fundamenta a resposta. O campo \"fundamento\" traz o dispositivo com o texto LITERAL da lei (ex.: \"CF/88, art. 37, III – ...\"). Nunca parafraseie o texto legal.",
    "4. Proibido inventar jurisprudência, súmulas, números de artigos ou leis. A resposta deve se sustentar só no texto legal.",
    "5. Se a questão envolver lei municipal ou estadual específica e você NÃO tiver o texto abaixo, prefira a legislação nacional aplicável (CF/88, leis federais). Se mesmo assim citar norma local, marque \"conferir\": true e não invente número de artigo.",
    "6. Em 'Conhecimentos do Município', cobre apenas fatos amplamente conhecidos e estáveis, e marque \"conferir\": true.",
    "7. Releia cada questão e confirme que o gabarito está correto antes de escrevê-la.",
    `8. ${dif}`, `9. ${fmt}`,
    base ? "\nTEXTO DA LEI fornecido pelo usuário (fonte principal; cite literalmente; o fundamento deve vir deste texto):\n\"\"\"\n" + base.slice(0, 80000) + "\n\"\"\"" : "",
    edital ? "\nCONTEÚDO PROGRAMÁTICO DO EDITAL (distribua as questões pelos tópicos, preenchendo \"assunto\" com o tópico do edital):\n\"\"\"\n" + edital.slice(0, 30000) + "\n\"\"\"" : "",
    avoid && avoid.length ? "\nNão repita nem parafraseie estes enunciados já existentes:\n- " + avoid.map(s => s.slice(0, 160)).join("\n- ") : "",
    "", "SAÍDA: um objeto JSON por LINHA (JSON Lines), sem markdown, sem texto antes ou depois, sem vírgulas entre linhas. Cada objeto:",
    '{"tipo":"ME"|"CE","dificuldade":"facil"|"medio"|"dificil","disciplina":string,"assunto":string,"estilo":"literalidade"|"caso prático"|"aplicação","enunciado":string,"alternativas":[string],"gabarito":string,"comentario":string,"fundamento":string,"conferir":boolean}',
    '"comentario": 1 a 3 frases explicando o gabarito e, na múltipla escolha, por que os principais distratores estão errados. "fundamento": "" quando não houver base legal (ex.: Português, Raciocínio Lógico).'
  ].filter(s => s !== "").join("\n");
}
function parseLine(line) {
  const s = line.trim().replace(/^```(json)?/i, "").replace(/```$/, "").replace(/,\s*$/, "").trim();
  if (!s.startsWith("{")) return null;
  try {
    const q = JSON.parse(s);
    if (!q || typeof q.enunciado !== "string" || !q.gabarito) return null;
    q.tipo = q.tipo === "CE" ? "CE" : "ME";
    if (q.tipo === "ME" && !Array.isArray(q.alternativas)) return null;
    if (q.tipo === "CE") q.gabarito = /^C/i.test(q.gabarito) ? "CERTO" : "ERRADO";
    else q.gabarito = norm(q.gabarito).slice(0, 1);
    q.dificuldade = fold(q.dificuldade);
    return q;
  } catch { return null; }
}
const ERR = {
  not_granted: "O uso do Claude não foi autorizado nesta página.",
  sampling_disabled: "O Claude não está disponível para esta conta.",
  rate_limited: "Muitas gerações seguidas ou o limite do seu plano acabou. Espere um pouco e tente de novo.",
  not_logged: "Entre com a sua conta do Claude ou do ChatGPT em Preferências.",
  not_configured: "Instale o Claude Code ou o app do ChatGPT neste Mac para gerar questões.",
  session_expired: "Sua sessão expirou. Entre de novo no Claude.",
  refused: "O Claude recusou este pedido. Ajuste o assunto ou o texto.",
  prompt_too_large: "O texto colado é grande demais. Cole só os artigos que interessam."
};
const errMsg = e => ERR[e && e.code] || "A geração falhou no meio do caminho. Tente de novo.";
async function generate(cfg, base, edital) {
  const ctl = new AbortController();
  const cad = { id: "cad_" + Date.now().toString(36), ts: Date.now(), cfg, questions: [], answers: {} };
  state.running = ctl; state.runningCad = cad; state.genStatus = ["A Gabi está elaborando as questões…", "busy"];
  go("caderno", { cur: cad.id, showAll: false });
  let pending = "";
  const push = line => { const q = parseLine(line); if (q && cad.questions.length < cfg.qtd) { cad.questions.push(q); state.genStatus = [`Questão ${cad.questions.length} de ${cfg.qtd} pronta…`, "busy"]; if (state.view === "caderno" && state.cur === cad.id) appendStreamed(cad); } };
  try {
    await caps.sample(buildPrompt(cfg, cfg.qtd, base, edital), { signal: ctl.signal, cache: false, onText: ({ delta }) => { const ls = (pending + delta).split("\n"); pending = ls.pop(); ls.forEach(push); } });
    if (pending.trim()) push(pending);
    state.genStatus = cad.questions.length ? [`${cad.questions.length} questões prontas e salvas no seu banco.`, ""] : ["Nenhuma questão veio no formato esperado. Tente de novo.", "err"];
  } catch (err) {
    if (pending.trim()) push(pending);
    state.genStatus = err && err.code === "cancelled" ? [`Parado com ${cad.questions.length} questões.`, ""] : [errMsg(err), "err"];
  } finally {
    state.running = null; state.runningCad = null;
    if (cad.questions.length) Store.saveCad(cad);
    if (state.view === "caderno" && state.cur === cad.id) render();
  }
}

/* ================= Cartão de questão ================= */
function renderQ(ctx) {
  const { q, cad, i } = ctx;
  const qid = cad.id + ":" + i;
  const card = glass("article", "q");
  const head = el("div", "q-head");
  head.append(el("span", "q-num", "Questão " + (ctx.num ?? i + 1)));
  if (DIF_LABEL[q.dificuldade]) head.append(el("span", "tag d-" + q.dificuldade, DIF_LABEL[q.dificuldade]));
  if (q.disciplina) head.append(el("span", "tag", q.disciplina));
  head.append(el("span", "sp"));
  if (ctx.mode !== "exam") {
    const a = el("div", "q-acts");
    const fav = state.prefs.favs.includes(qid), rep = state.prefs.reports.includes(qid);
    a.append(iconBtn(fav ? I.starF : I.star, fav ? "Remover das favoritas" : "Favoritar", () => { toggleFav(qid); card.replaceWith(renderQ(ctx)); }, fav));
    a.append(iconBtn(I.flag, rep ? "Remover reporte de erro" : "Reportar erro", () => { toggleReport(qid); card.replaceWith(renderQ(ctx)); }, rep));
    if (ctx.swap && caps.sample && !state.running && !cad.exemplo) a.append(iconBtn(I.swap, "Trocar por outra questão", e => swapQuestion(cad, i, e.currentTarget)));
    head.append(a);
  }
  card.append(head);
  if (ctx.showSrc) card.append(el("p", "q-src", cadTitle(cad) + " · " + (q.assunto || cad.cfg.banca)));
  card.append(el("p", "stem", q.enunciado));
  const ans = ctx.mode === "exam" ? null : (cad.answers || {})[i];
  const answered = ans != null;
  const reveal = ctx.mode === "review" || answered || (ctx.mode === "study" && state.showAll);
  const isCE = q.tipo === "CE";
  const opts = isCE ? [["C", "CERTO", "Certo"], ["E", "ERRADO", "Errado"]] : (q.alternativas || []).map((a, k) => ["ABCDE"[k], "ABCDE"[k], a]);
  const box = el(isCE ? "div" : "ol", isCE ? "ce" : "alts");
  const mine = ctx.mode === "review" ? ctx.picked : ans;
  const struck = ctx.struck || (ctx.struck = new Set());
  const redraw = () => card.replaceWith(renderQ(ctx));
  opts.forEach(([bub, val, txt]) => {
    const b = el("button", "alt"); b.type = "button";
    b.append(el("span", "bubble", bub), el("span", null, txt));
    const isStruck = !reveal && struck.has(val);
    if (isStruck) b.classList.add("struck");
    if (ctx.mode === "exam") { if (norm(ctx.picked) === norm(val)) b.classList.add("picked"); b.onclick = () => { struck.delete(val); ctx.onPick(val); }; }
    else if (reveal) {
      b.disabled = true;
      if (norm(val) === norm(q.gabarito)) b.classList.add("right");
      else if (mine != null && norm(mine) === norm(val)) b.classList.add("wrong");
    } else {
      if (ctx.pending != null && norm(ctx.pending) === norm(val)) b.classList.add("picked");
      b.onclick = () => { struck.delete(val); ctx.pending = val; redraw(); };
    }
    b.setAttribute("aria-label", (isCE ? txt : "Alternativa " + bub + ": " + txt) + (isStruck ? " (riscada)" : ""));
    let node = b;
    if (!isCE && !reveal) {
      const row = el("div", "altrow");
      const cut = iconBtn(I.cut, isStruck ? "Desfazer risco da " + bub : "Riscar alternativa " + bub, () => {
        if (struck.has(val)) struck.delete(val); else { struck.add(val); if (norm(ctx.pending) === norm(val)) ctx.pending = null; }
        if (ctx.mode === "exam" && norm(ctx.picked) === norm(val) && struck.has(val)) { ctx.onPick(null); return; }
        redraw();
      }, isStruck);
      cut.classList.add("cut");
      row.append(b, cut); node = row;
    }
    if (isCE) box.append(node); else { const li = el("li"); li.append(node); box.append(li); }
  });
  card.append(box);
  if (ctx.mode === "study" && !reveal) {
    const ar = el("div", "answer-row");
    const rb = btn("btn sm", "Responder", () => {
      cad.answers = cad.answers || {}; cad.answers[i] = ctx.pending; ctx.pending = null;
      Store.saveAnswers(cad); redraw(); ctx.after && ctx.after();
    });
    rb.disabled = ctx.pending == null;
    const lbl = ctx.pending == null ? (isCE ? "Julgue o item como certo ou errado." : "Escolha uma alternativa. Use a tesoura para riscar as que você descartou.") : "Marcada: " + (isCE ? (ctx.pending === "CERTO" ? "Certo" : "Errado") : ctx.pending);
    ar.append(rb, el("span", "hint", lbl));
    card.append(ar);
  }
  if (reveal) {
    const sol = el("div", "sol");
    const m = mine;
    if (m != null) sol.append(el("div", "verdict " + (isRight(q, m) ? "ok" : "bad"), (isRight(q, m) ? "Você acertou · " : "Você errou · ") + "Gabarito " + q.gabarito));
    else sol.append(el("div", "verdict", (ctx.mode === "review" ? "Em branco · " : "") + "Gabarito " + q.gabarito));
    if (q.comentario) sol.append(el("p", null, q.comentario));
    if (q.fundamento) { const l = el("div", "law"); l.append(el("span", "lab", "Fundamento legal"), document.createTextNode(q.fundamento)); sol.append(l); }
    if (q.conferir) sol.append(el("div", "check", "Esta questão cita norma local. Confirme o artigo no texto oficial antes de usar."));
    if (answered && ctx.mode === "study") { const r = el("div"); r.append(btn("tbtn", "Tentar de novo", () => { delete cad.answers[i]; ctx.struck = new Set(); Store.saveAnswers(cad); redraw(); ctx.after && ctx.after(); }, I.redo)); sol.append(r); }
    card.append(sol);
  }
  return card;
}
function toggleFav(qid) { const f = state.prefs.favs; const k = f.indexOf(qid); k >= 0 ? f.splice(k, 1) : f.push(qid); Store.savePrefs(); toast(k >= 0 ? "Removida das favoritas" : "Adicionada às favoritas"); }
function toggleReport(qid) { const f = state.prefs.reports; const k = f.indexOf(qid); k >= 0 ? f.splice(k, 1) : f.push(qid); Store.savePrefs(); toast(k >= 0 ? "Reporte removido" : "Erro reportado. A questão fica marcada para revisão."); }
async function swapQuestion(cad, i, b) {
  if (!caps.sample || state.running) return;
  const c = { ...cad.cfg }; const old = cad.questions[i];
  if (old.disciplina) c.disc = [old.disciplina];
  if (DIF_LABEL[old.dificuldade]) c.dific = old.dificuldade;
  b.disabled = true; toast("Trocando a questão " + (i + 1) + "…");
  try {
    const { text } = await caps.sample(buildPrompt(c, 1, "", "", cad.questions.map(q => q.enunciado)), { cache: false });
    const q = text.split("\n").map(parseLine).find(Boolean);
    if (!q) throw { code: "invalid" };
    cad.questions[i] = q; if (cad.answers) delete cad.answers[i];
    Store.saveCad(cad); render(); toast("Questão " + (i + 1) + " trocada");

}

function asText(cad) {
  const out = [cadTitle(cad), cadSub(cad.cfg), ""];
  cad.questions.forEach((q, i) => {
    out.push(`Questão ${i + 1} (${DIF_LABEL[q.dificuldade] || "—"} · ${q.disciplina || ""})`, q.enunciado);
    if (q.tipo === "ME") q.alternativas.forEach((a, k) => out.push(`(${"ABCDE"[k]}) ${a}`));
    out.push(`Gabarito: ${q.gabarito}`);
    if (q.comentario) out.push(`Comentário: ${q.comentario}`);
    if (q.fundamento) out.push(`Fundamento: ${q.fundamento}`);
    out.push("");
  });
  return out.join("\n");
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Caderno copiado"); }
  catch { const t = el("textarea"); t.value = txt; document.body.append(t); t.select(); try { document.execCommand("copy"); toast("Caderno copiado"); } catch { toast("Não deu para copiar neste app."); } t.remove(); }
}
const esc = s => String(s || "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function asDoc(cad) {
  const c = cad.cfg;
  const P = (html, st = "") => `<p style="margin:0;line-height:115%;font-family:Arial;font-size:11pt;${st}">${html}</p>`;
  let out = `<html><head><meta charset="utf-8"><style>@page{margin:2.54cm}</style></head><body>`;
  cad.questions.forEach((q, i) => {
    const ce = q.tipo === "CE";
    const gc = ce ? (q.gabarito === "CERTO" ? "#00B050" : "#FF0000") : "#000";
    out += P(`<b>Questão ${i + 1}</b>`, "font-size:14pt;color:#363642;background:#d0cece");
    out += P("Aba Cadastro de Questão", "font-size:12pt;color:#0070C0");
    out += P(`<b>PROVA:</b> ${esc(cadTitle(cad))} / ${esc(c.cargo)} / estilo ${esc(c.banca)} / ${new Date().getFullYear()}`);
    out += P(`<b>TIPO:</b> ${ce ? "Certo/Errado" : "Múltipla Escolha"}`);
    out += P(`<b>DIFICULDADE:</b> ${DIF_LABEL[q.dificuldade] || ""} · <b>DISCIPLINA:</b> ${esc(q.disciplina)}`);
    out += P("<b>ENUNCIADO:</b>") + P(esc(q.enunciado));
    if (!ce) q.alternativas.forEach((a, k) => out += P(`(${"ABCDE"[k]}) ${esc(a)}`));
    out += P(`<b>GABARITO:</b> <b style="color:${gc}">${esc(q.gabarito)}</b>`);
    out += P(`<b>CLASSIFICAÇÃO:</b> ${esc(q.assunto || q.disciplina)}`);
    out += P("<b>ID DA QUESTÃO:</b>");
    out += P("Aba Cadastro de Solução", "font-size:12pt;color:#0070C0");
    out += P(`<b>${esc(q.gabarito)}.</b> ${esc(q.comentario)}`);
    if (q.fundamento) out += P(esc(q.fundamento), "font-size:10.5pt;color:#333333");
    if (q.conferir) out += P("<b>[CONFERIR NORMA LOCAL]</b>", "color:#FF0000");
    out += P("&nbsp;");
  });
  return out + "</body></html>";
}
async function downloadDoc(cad) {
  if (!caps.downloads) return;
  const slug = fold(cad.cfg.municipio || cad.cfg.orgao || "caderno").replace(/[^a-z0-9]+/g, "-");
  try { await caps.downloads.save({ filename: `questoes-ineditas-${slug}.doc`, data: new Blob([asDoc(cad)], { type: "application/msword" }) }); toast("Arquivo salvo"); }
  catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("Não foi possível salvar o arquivo."); }
}

/* ================= Boot ================= */
(function () { const old = lsGet("ineditas.theme", null); if (old && !lsGet("ineditas.ui", null)) lsSet("ineditas.ui", { theme: old }); applyUI(getUI()); })();
let capsPromise = null;
function waitCaps() {
  if (capsPromise) return capsPromise;
  capsPromise = (async () => {
    const c = window.claude;
    if (c && c.use) {
      const [s, d, db, u] = await Promise.all(["sample", "downloads", "db", "user"].map(n => c.use(n).catch(() => null)));
      caps = { sample: s, downloads: d, db, user: u, ready: true };
    } else caps.ready = true;
  })();
  return capsPromise;
}
if (state.logged) state.user = { name: "" };
render();
waitCaps().then(async () => {
  if (state.logged) {
    let name = ""; try { name = caps.user ? (await caps.user.me()).name : ""; } catch {}
    state.user = { name: name || (caps.db ? "" : "Visitante") };
    await Store.init();
  }
});
</script>
